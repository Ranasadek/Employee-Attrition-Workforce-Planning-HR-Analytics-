<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Analytics Dashboard - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d1117;
        }

        /* الحاوية الأساسية بمقاس 1280x720 مع ألوان متداخلة غنية خلف الزجاج */
        .dashboard-container {
            width: 1280px;
            height: 720px;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.75) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.7) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(56, 189, 248, 0.65) 0%, transparent 50%),
                radial-gradient(circle at 90% 85%, rgba(236, 72, 153, 0.5) 0%, transparent 45%),
                linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 50px;
            position: relative;
            overflow: hidden;
        }

        /* الطبقة الزجاجية فوق الخلفية الملونة لتنعيم الألوان */
        .dashboard-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1;
        }

        /* إظهار محتويات الديزاين فوق الطبقة الزجاجية */
        .brand-header, .title-section, .nav-cards-container, .explore-btn {
            position: relative;
            z-index: 2;
        }

        /* --- اللوجو ودائرة HR --- */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }

        .we-circle-wrapper {
            position: relative;
            width: 58px;
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .we-circle {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -1px;
            z-index: 2;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* جعل حرف الـ R بنفس لون وتدرج كلمة ANALYTICS */
        .we-circle span {
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2.5px solid #38bdf8;
            border-right: 2px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            animation: spinOrbit 2.5s linear infinite;
        }

        .orbit-ring-outer {
            position: absolute;
            width: 118%;
            height: 118%;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-bottom: 2px solid #c084fc;
            animation: spinOrbitReverse 4s linear infinite;
        }

        @keyframes spinOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinOrbitReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .telecom-text {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .telecom-text span {
            color: #38bdf8;
        }

        /* --- قسم العنوان الرئيسي --- */
        .title-section {
            text-align: center;
            margin-top: -10px;
        }

        .main-title {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .title-white {
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0,0,0,0.3);
        }

        .title-cyan {
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 10px;
        }

        .subtitle {
            color: #e2e8f0;
            font-size: 18px;
            font-weight: 500;
            margin-top: 10px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        /* --- كروت أزرار الصفحات الـ 5 الشفافة --- */
        .nav-cards-container {
            display: flex;
            justify-content: center;
            gap: 18px;
            width: 100%;
            margin-top: 10px;
        }

        .nav-card {
            flex: 1;
            height: 100px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .nav-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.25);
            border-color: #38bdf8;
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.3);
        }

        .card-number {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            line-height: 1.35;
        }

        /* --- زر EXPLORE DASHBOARD --- */
        .explore-btn {
            background: linear-gradient(90deg, #0284c7, #7c3aed);
            color: #ffffff;
            padding: 12px 38px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .explore-btn:hover {
            box-shadow: 0 12px 35px rgba(56, 189, 248, 0.6);
            transform: scale(1.05);
        }

        .explore-btn span {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- اللوجو مع دائرة HR -->
        <div class="brand-header">
            <div class="we-circle-wrapper">
                <div class="orbit-ring-outer"></div>
                <div class="orbit-ring"></div>
                <div class="we-circle">H<span>R</span></div>
            </div>
            <div class="telecom-text">WORKFORCE <span>ANALYTICS</span></div>
        </div>

        <!-- العنوان الرئيسي -->
        <div class="title-section">
            <h1 class="main-title">
                <span class="title-white">EMPLOYEE ATTRITION </span>
                <span class="title-cyan">ANALYTICS</span>
            </h1>
            <p class="subtitle">Executive Performance & Predictive Retention Dashboard</p>
        </div>

        <!-- أزرار كروت الصفحات الـ 5 -->
        <div class="nav-cards-container">
            <a href="#" class="nav-card">
                <span class="card-number">PAGE 01</span>
                <span class="card-title">Executive Overview</span>
            </a>

            <a href="#" class="nav-card">
                <span class="card-number">PAGE 02</span>
                <span class="card-title">Attrition Risk Analysis</span>
            </a>

            <a href="#" class="nav-card">
                <span class="card-number">PAGE 03</span>
                <span class="card-title">Compensation & Career</span>
            </a>

            <a href="#" class="nav-card">
                <span class="card-number">PAGE 04</span>
                <span class="card-title">Work-Life & Satisfaction</span>
            </a>

            <a href="#" class="nav-card">
                <span class="card-number">PAGE 05</span>
                <span class="card-title">Demographics</span>
            </a>
        </div>

        <!-- زر الدخول -->
        <a href="#" class="explore-btn">
            EXPLORE DASHBOARD <span>➔</span>
        </a>

    </div>

</body>
</html>
